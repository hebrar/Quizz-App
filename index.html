<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QuizApp - Giriş Yap</title>
</head>
<body>

    <h1>QuizApp Platformuna Hoş Geldiniz</h1>
    <p>İnteraktif test oluşturma ve çözme platformu</p>

    <hr>

    <!-- ÖĞRETMEN GİRİŞ BÖLÜMÜ -->
    <section>
        <h2>Öğretmen Girişi</h2>
        <form id="teacherForm">
            <label>E-posta Adresi:</label><br>
            <input type="email" id="email" placeholder="ornek@okul.edu.tr" required><br><br>

            <label>Şifre (En az 6 karakter):</label><br>
            <input type="password" id="password" placeholder="******" required><br><br>

            <button type="submit" style="padding: 8px 16px; font-weight: bold; cursor: pointer;">Giriş Yap</button>
        </form>
    </section>

    <br>
    <hr>
    <br>

    <!-- ÖĞRENCİ TESTE KATILMA BÖLÜMÜ -->
    <section>
        <h2>Öğrenci Test Girişi</h2>
        <p>Öğretmeninizin sizinle paylaştığı test kodunu girerek sınava katılabilirsiniz.</p>
        
        <form id="studentForm">
            <label>Ad Soyad:</label><br>
            <input type="text" id="studentName" placeholder="Adınız Soyadınız" required><br><br>

            <label>Öğrenci Numarası:</label><br>
            <input type="text" id="studentNo" placeholder="Numaranız" required><br><br>

            <label>Test / Oda Kodu:</label><br>
            <input type="text" id="quizCode" placeholder="Örn: QUIZ-9907" required><br><br>

            <button type="submit" style="padding: 8px 16px; font-weight: bold; cursor: pointer;">Testi Başlat</button>
        </form>
    </section>

    <!-- FIREBASE AUTH & JAVASCRIPT ENTEGRASYONU -->
    <script type="module">
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from "./firebase-config.js";

        // ÖĞRETMEN GİRİŞ YAP VEYA OTOMATİK KAYIT OL
        document.getElementById("teacherForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                // 1. Önce Mevcut Kullanıcı Girişini Dene
                await signInWithEmailAndPassword(auth, email, password);
                alert("Giriş başarılı! Kontrol paneline yönlendiriliyorsunuz.");
                window.location.href = "dashboard.html";
            } catch (error) {
                // 2. Eğer Kullanıcı Yoksa Otomatik Olarak Hesabı Oluştur ve Giriş Yaptır
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        alert("Hesabınız oluşturuldu ve giriş yapıldı! Kontrol paneline yönlendiriliyorsunuz.");
                        window.location.href = "dashboard.html";
                    } catch (registerError) {
                        alert("Hata: " + registerError.message);
                    }
                } else {
                    alert("Giriş Hatası: " + error.message);
                }
            }
        });

        // ÖĞRENCİ TESTE KATIL
        document.getElementById("studentForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const code = document.getElementById("quizCode").value.trim();
            window.location.href = `Student.html?code=${code}`;
        });
    </script>

</body>
</html>
