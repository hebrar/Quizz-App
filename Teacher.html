<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QuizApp - Test Oluştur</title>
</head>
<body>

    <!-- ÜST BİLGİ VE NAVİGASYON -->
    <header>
        <h1>Yeni Test Oluşturma Ekranı</h1>
        <p>Aşağıdan sınav başlığını girip istediğiniz kadar soru ekleyebilirsiniz.</p>
        <a href="dashboard.html"><button type="button">← Kontrol Paneline Dön</button></a>
    </header>

    <hr>

    <!-- TEST OLUŞTURMA FORMU -->
    <form id="testForm">
        <section>
            <h2>1. Test Genel Bilgileri</h2>
            <label>Test / Sınav Başlığı:</label><br>
            <input type="text" id="testBaslik" placeholder="Örn: Yapay Zekaya Giriş - Vize Sınavı" required style="width: 300px;"><br><br>
        </section>

        <hr>

        <section>
            <h2>2. Soru Ekleme Alanı</h2>
            <div id="sorularKapsayici">
                <!-- Dinamik Sorular Buraya Eklenecek -->
            </div>

            <br>
            <button type="button" id="soruEkleBtn" style="padding: 8px 16px; font-weight: bold; cursor: pointer;">+ Soru Ekle</button>
        </section>

        <br><hr><br>

        <button type="submit" style="padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #4CAF50; color: white; border: none; cursor: pointer;">Testi Kaydet ve Yayınla</button>
    </form>

    <!-- FIREBASE & JAVASCRIPT KODU -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // GÜVENLİK: ÖĞRETMEN PIN KONTROLÜ
        const OGRETMEN_PIN = "1234";

        const girilenPin = prompt("Lütfen Test Oluşturmak İçin Öğretmen PIN Kodunu Giriniz:");
        if (girilenPin !== OGRETMEN_PIN) {
            alert("Hatalı PIN Kodu! Kontrol paneline yönlendiriliyorsunuz.");
            window.location.href = "dashboard.html";
        }

        let soruSayaci = 0;

        function yeniSoruEkle() {
            soruSayaci++;
            const sorularKapsayici = document.getElementById("sorularKapsayici");

            const soruHTML = `
                <div class="soru-kart" id="soru_${soruSayaci}" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px;">
                    <h3>Soru ${soruSayaci}</h3>
                    
                    <label>Soru Metni:</label><br>
                    <textarea class="soru-metin" rows="2" style="width: 100%;" required placeholder="Soruyu buraya yazınız..."></textarea><br><br>

                    <label>A Şıkkı:</label> <input type="text" class="sik-a" required><br><br>
                    <label>B Şıkkı:</label> <input type="text" class="sik-b" required><br><br>
                    <label>C Şıkkı:</label> <input type="text" class="sik-c" required><br><br>
                    <label>D Şıkkı:</label> <input type="text" class="sik-d" required><br><br>

                    <label><strong>Doğru Cevap Hangi Şık?</strong></label>
                    <select class="dogru-cevap" required>
                        <option value="A">A Şıkkı</option>
                        <option value="B">B Şıkkı</option>
                        <option value="C">C Şıkkı</option>
                        <option value="D">D Şıkkı</option>
                    </select>
                </div>
            `;
            
            sorularKapsayici.innerHTML += soruHTML;
        }

        yeniSoruEkle();

        document.getElementById("soruEkleBtn").addEventListener("click", yeniSoruEkle);

        // TESTİ KAYDET
        document.getElementById("testForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const baslik = document.getElementById("testBaslik").value.trim();
            const soruKartlari = document.querySelectorAll(".soru-kart");
            const sorular = [];
            
            // Giriş yapan öğretmenin e-postası
            const teacherEmail = localStorage.getItem("teacherEmail") || "hebrarkar@gmail.com";

            soruKartlari.forEach((kart) => {
                const metin = kart.querySelector(".soru-metin").value.trim();
                const sikA = kart.querySelector(".sik-a").value.trim();
                const sikB = kart.querySelector(".sik-b").value.trim();
                const sikC = kart.querySelector(".sik-c").value.trim();
                const sikD = kart.querySelector(".sik-d").value.trim();
                const dogruCevap = kart.querySelector(".dogru-cevap").value;

                sorular.push({ metin, sikA, sikB, sikC, sikD, dogruCevap });
            });

            const rastgeleKod = "QUIZ-" + Math.floor(1000 + Math.random() * 9000);

            try {
                await addDoc(collection(db, "tests"), {
                    baslik: baslik,
                    testKodu: rastgeleKod,
                    sorular: sorular,
                    teacherEmail: teacherEmail,
                    olusturmaTarihi: new Date().toISOString()
                });

                alert(`Test Başarıyla Oluşturuldu!\n\nTest / Oda Kodu: ${rastgeleKod}`);
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Test kaydedilirken hata oluştu: ", error);
                alert("Test kaydedilirken bir hata oluştu.");
            }
        });
    </script>

</body>
</html>
